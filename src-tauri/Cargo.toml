[package]
name = "law-gorithm"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
# tesseract = "0.14"  # Using bundled binary instead
pdf-extract = "0.7"
rusqlite = { version = "0.29", features = ["bundled", "load_extension"] }
dirs = "5.0"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4"] }
regex = "1.10"
pyo3 = "0.19"  # For Python integration

[dev-dependencies]
tempfile = "3.0"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[features]
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[profile.release]
panic = "abort"   # Strip costly panic clean-up logic from executable
codegen-units = 1 # Compile crates one after another so the compiler can optimize better
lto = true        # Enables link to optimize (LTO) to optimize binaries at link time
opt-level = 3     # Optimize for speed
strip = true      # Strip debug info from executable
