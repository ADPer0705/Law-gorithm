[package]
name = "law-gorithm"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4"] }
dirs = "5.0"
rusqlite = { version = "0.31", features = ["bundled"] }
regex = "1.10"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1.0", features = ["full"] }
thiserror = "1.0"
dotenv = "0.15"
tempfile = "3.0"
once_cell = "1.19"
tesseract = "0.15"
# Lightweight CPU-only NER (works on any computer)
anyhow = "1.0"

[dev-dependencies]
tempfile = "3.0"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }
pkg-config = "0.3"

[features]
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
# Define optional features used by cfg(feature = "...") gates in the codebase.
# Enable with: cargo build --features embeddings
embeddings = []

[profile.release]
panic = "abort"   # Strip costly panic clean-up logic from executable
codegen-units = 1 # Compile crates one after another so the compiler can optimize better
lto = true        # Enables link to optimize (LTO) to optimize binaries at link time
opt-level = 3     # Optimize for speed
strip = true      # Strip debug info from executable
