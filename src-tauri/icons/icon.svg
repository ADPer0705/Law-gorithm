<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
  
  <!-- Scale/Balance icon representing Law -->
  <g transform="translate(64,64)" fill="white">
    <!-- Base -->
    <rect x="-2" y="15" width="4" height="20" />
    <rect x="-15" y="32" width="30" height="3" />
    
    <!-- Central pole -->
    <rect x="-1" y="-25" width="2" height="40" />
    
    <!-- Balance beam -->
    <rect x="-25" y="-27" width="50" height="2" />
    
    <!-- Left scale -->
    <path d="M-25,-25 L-35,-15 L-15,-15 Z" />
    <rect x="-35" y="-17" width="20" height="2" />
    
    <!-- Right scale -->
    <path d="M25,-25 L35,-15 L15,-15 Z" />
    <rect x="15" y="-17" width="20" height="2" />
    
    <!-- Algorithm symbols (dots representing data points) -->
    <circle cx="-25" cy="-8" r="1.5" />
    <circle cx="-20" cy="-5" r="1.5" />
    <circle cx="-30" cy="-5" r="1.5" />
    
    <circle cx="25" cy="-8" r="1.5" />
    <circle cx="20" cy="-5" r="1.5" />
    <circle cx="30" cy="-5" r="1.5" />
  </g>
</svg>
